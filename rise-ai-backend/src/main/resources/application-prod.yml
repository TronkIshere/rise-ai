spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    hikari:
      max-lifetime: 1500000
      connection-timeout: 10000
      leak-detection-threshold: 30000

rise:
  security:
    jwt:
      secret: ${RISE_JWT_SECRET}
    cors-allowed-origins: ${RISE_CORS_ALLOWED_ORIGINS}
  simulation:
    donation-confirmation-enabled: false
  seed:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.riseai: INFO

rise:
  security:
    jwt:
      secret: ${RISE_JWT_SECRET}
    cors-allowed-origins: ${RISE_CORS_ALLOWED_ORIGINS}
  simulation:
    donation-confirmation-enabled: false
  seed:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.riseai: INFO

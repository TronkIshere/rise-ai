services:
  mysql:
    image: mysql:8.4
    container_name: rise-ai-mysql
    restart: unless-stopped
    command:
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: rise_ai
      MYSQL_USER: rise_app
      MYSQL_PASSWORD: ${RISE_DB_PASSWORD:?set RISE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${RISE_DB_ROOT_PASSWORD:?set RISE_DB_ROOT_PASSWORD}
    volumes:
      - rise_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -urise_app -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  rise-ai-monitoring:
    build: ./rise-ai-monitoring
    container_name: rise-ai-monitoring
    restart: unless-stopped
    stop_grace_period: 40s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SPRING_PROFILES_ACTIVE: riseai
      MONITORING_SERVICE_KEY: ${RISE_MONITORING_SERVICE_KEY:?set RISE_MONITORING_SERVICE_KEY}
      MONITORING_PREVIOUS_SERVICE_KEY: ${RISE_MONITORING_PREVIOUS_SERVICE_KEY:-}
      MONITORING_AI_ENABLED: "false"
      SERVER_ADDRESS: 0.0.0.0
    volumes:
      - rise_monitoring_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081 && printf \"GET /actuator/health HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12

  rise-ai-backend:
    build: ./rise-ai-backend
    container_name: rise-ai-backend
    restart: unless-stopped
    stop_grace_period: 40s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mysql:
        condition: service_healthy
      rise-ai-monitoring:
        condition: service_healthy
      avalanche-bootstrap:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rise_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: rise_app
      SPRING_DATASOURCE_PASSWORD: ${RISE_DB_PASSWORD:?set RISE_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      RISE_JWT_SECRET: ${RISE_JWT_SECRET:?set RISE_JWT_SECRET}
      RISE_CORS_ALLOWED_ORIGINS: ${RISE_CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      # avalanche: mirror escrow on the local Anvil chain through the gateway; simulated: MySQL only (the chain services still start)
      RISE_ESCROW_ENGINE: ${RISE_ESCROW_ENGINE:-avalanche}
      RISE_AVALANCHE_GATEWAY_URL: http://rise-ai-avalanche:8082
      RISE_AVALANCHE_INTERNAL_API_KEY: ${RISE_AVALANCHE_INTERNAL_API_KEY:?set RISE_AVALANCHE_INTERNAL_API_KEY}
      # Anvil's public test account 3: a fixed simulation beneficiary, no key needed by anyone
      RISE_AVALANCHE_BENEFICIARY_ADDRESS: ${RISE_AVALANCHE_BENEFICIARY_ADDRESS:-0x90F79bf6EB2c4f870365E785982E1f101E93b906}
      RISE_AVALANCHE_RELEASE_DELAY: ${RISE_AVALANCHE_RELEASE_DELAY:-PT2M}
      RISE_MONITORING_ENABLED: "true"
      RISE_MONITORING_BASE_URL: http://rise-ai-monitoring:8081
      RISE_MONITORING_SERVICE_KEY: ${RISE_BACKEND_MONITORING_KEY:-${RISE_MONITORING_SERVICE_KEY:?set RISE_MONITORING_SERVICE_KEY}}
      RISE_SEED_ENABLED: ${RISE_SEED_ENABLED:-false}
      RISE_DEMO_PASSWORD: ${RISE_DEMO_PASSWORD:-Demo@12345}
      RISE_SIMULATION_DONATION_CONFIRMATION_ENABLED: ${RISE_SIMULATION_ENABLED:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /actuator/health/readiness HTTP/1.0\r\n\r\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  rise-ai-frontend:
    build:
      context: ./rise-ai-frontend
      additional_contexts:
        backend_contract: ./rise-ai-backend/docs/api
    container_name: rise-ai-frontend
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      rise-ai-backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: http://rise-ai-backend:8080
    ports:
      - "127.0.0.1:${RISE_FRONTEND_HTTP_PORT:-5174}:80"

  # --- Avalanche, LOCAL_SIMULATION only: Anvil chain 31337, test token, ephemeral dev signers; no real key anywhere ---

  avalanche-db-init:
    image: mysql:8.4
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${RISE_DB_ROOT_PASSWORD:?set RISE_DB_ROOT_PASSWORD}
    # shortcut: the gateway reuses the rise_app user on its own database; give it a separate user before any shared deployment
    command: >-
      mysql -h mysql -uroot -e "CREATE DATABASE IF NOT EXISTS avalanche_gateway CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      GRANT ALL PRIVILEGES ON avalanche_gateway.* TO 'rise_app'@'%';"

  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.7
    container_name: rise-ai-anvil
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337", "--state", "/home/foundry/state.json", "--state-interval", "30"]
    volumes:
      - rise_anvil_data:/home/foundry
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 12

  avalanche-contracts:
    build: ./rise-ai-avalanche/contracts
    image: rise-ai-avalanche-contracts:local
    restart: "no"
    depends_on:
      anvil:
        condition: service_healthy
    command: ["docker/deploy-local.sh"]
    volumes:
      - rise_avalanche_manifest:/work/deployments

  rise-ai-avalanche:
    build: ./rise-ai-avalanche
    container_name: rise-ai-avalanche
    # the dev signers are new random keys on every start, so a restart needs avalanche-bootstrap again (docker compose up)
    restart: "no"
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      avalanche-contracts:
        condition: service_completed_successfully
      avalanche-db-init:
        condition: service_completed_successfully
    environment:
      AVALANCHE_ENVIRONMENT: LOCAL_SIMULATION
      AVALANCHE_RPC_PRIMARY_URL: http://anvil:8545
      AVALANCHE_SIGNERS_ENABLED: "true"
      AVALANCHE_SIGNERS_MODE: dev
      AVALANCHE_TX_ENABLED: "true"
      AVALANCHE_TX_RECONCILE_INTERVAL_MS: "2000"
      AVALANCHE_DEPLOYMENT_MANIFEST: /manifest/LOCAL_SIMULATION.json
      AVALANCHE_DB_URL: jdbc:mysql://mysql:3306/avalanche_gateway?useSSL=false&allowPublicKeyRetrieval=true
      AVALANCHE_DB_USERNAME: rise_app
      AVALANCHE_DB_PASSWORD: ${RISE_DB_PASSWORD:?set RISE_DB_PASSWORD}
      AVALANCHE_INTERNAL_API_KEY: ${RISE_AVALANCHE_INTERNAL_API_KEY:?set RISE_AVALANCHE_INTERNAL_API_KEY}
      LOGGING_FILE_NAME: /shared/gateway.log
    volumes:
      - rise_avalanche_manifest:/manifest:ro
      - rise_avalanche_shared:/shared
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082 && printf \"GET /api/v1/avalanche/status HTTP/1.0\r\n\r\n\" >&3 && grep -q LOCAL_SIMULATION <&3'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  avalanche-bootstrap:
    image: rise-ai-avalanche-contracts:local
    pull_policy: never  # built by avalanche-contracts
    restart: "no"
    depends_on:
      rise-ai-avalanche:
        condition: service_healthy
    command: ["docker/bootstrap-local.sh"]
    volumes:
      - rise_avalanche_manifest:/work/deployments:ro
      - rise_avalanche_shared:/shared:ro

volumes:
  rise_mysql_data:
  rise_monitoring_data:
  rise_anvil_data:
  rise_avalanche_manifest:
  rise_avalanche_shared:

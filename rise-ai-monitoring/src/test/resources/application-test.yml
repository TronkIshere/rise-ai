spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1

monitoring:
  limits:
    max-request-bytes: 16384
  rules:
    thresholds:
      - attribute: latencyMs
        max: 1000
  delivery:
    log-results: false

ollama:
  model: test-model
  connect-timeout: 500ms
  request-timeout: 500ms
  status-timeout: 500ms

name: Rise AI isolated staging integration (React + real API + MySQL)
on:
  push:
    branches: [qa/staging-react-real-api-20261110]
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/staging-react-integration.yml'
  pull_request:
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/staging-react-integration.yml'
permissions:
  contents: read

jobs:
  staging-real-api-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rise_ai
          MYSQL_USER: rise_dev
          MYSQL_PASSWORD: rise_dev_password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rise-ai-frontend/package-lock.json
      - name: Enable Flyway triggers in disposable MySQL
        run: |
          mysql_id=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -1)
          test -n "$mysql_id"
          docker exec "$mysql_id" mysql -uroot -pci-only-root-password -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - name: Compile real Spring Boot backend
        working-directory: rise-ai-backend
        run: mvn -B -DskipTests package
      - name: Start Spring Boot against disposable MySQL
        env:
          RISE_MONITORING_ENABLED: 'false'
          RISE_SEED_ENABLED: 'true'
          RISE_JOBS_ENABLED: 'false'
          RISE_JWT_SECRET: ci-only-staging-integration-jwt-secret-32-bytes
          RISE_SECURITY_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5174
        run: |
          jar_path=$(find rise-ai-backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' ! -name '*-sources.jar' | head -1)
          test -n "$jar_path"
          nohup java -jar "$jar_path" > /tmp/rise-staging-backend.log 2>&1 &
          ready=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -150 /tmp/rise-staging-backend.log; exit 1; fi
      - name: Build and start Nginx React staging at loopback only
        env:
          RISE_FRONTEND_BACKEND_UPSTREAM: http://host.docker.internal:8080
          RISE_FRONTEND_HTTP_PORT: '5174'
        run: |
          docker compose -f rise-ai-frontend/compose.frontend.yml config --quiet
          docker compose -f rise-ai-frontend/compose.frontend.yml up --build -d
          ready=0
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5174/healthz | grep -qx 'ok'; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then docker compose -f rise-ai-frontend/compose.frontend.yml logs --tail=100; exit 1; fi
      - name: Check real Nginx same-origin API and SPA routes
        working-directory: rise-ai-frontend
        env:
          RISE_FE06_BASE_URL: http://127.0.0.1:5174
          RISE_FE06_TARGET: docker
        run: node scripts/smoke-deployment.mjs
      - name: Install Chromium browser and isolated QA dependency
        working-directory: rise-ai-frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture actual React UI with real Backend and test interactive filter
        working-directory: rise-ai-frontend
        env:
          RISE_STAGING_BASE_URL: http://127.0.0.1:5174
        run: node scripts/staging-react-real-api.qa.mjs
      - name: Collect diagnostic logs if failed
        if: failure()
        run: |
          tail -150 /tmp/rise-staging-backend.log || true
          RISE_FRONTEND_BACKEND_UPSTREAM=http://host.docker.internal:8080 docker compose -f rise-ai-frontend/compose.frontend.yml logs --tail=120 || true
      - name: Upload real browser screenshots and QA JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rise-staging-real-react-api-1440-evidence
          path: rise-ai-frontend/visual-qa/staging-react-real-api/
          retention-days: 14
          if-no-files-found: warn

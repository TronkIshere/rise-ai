name: Homepage B2 isolated staging acceptance (1440px)
on:
  push:
    branches: [test/homepage-b2-staging-acceptance-20261108]
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/b2-staging-acceptance.yml'
permissions:
  contents: read
jobs:
  staging-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: rise_ai
          MYSQL_USER: rise_dev
          MYSQL_PASSWORD: rise_dev_password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      RISE_FRONTEND_BACKEND_UPSTREAM: http://host.docker.internal:8080
      RISE_FRONTEND_HTTP_PORT: '5174'
      RISE_FE06_BASE_URL: http://127.0.0.1:5174
      RISE_FE06_TARGET: docker
      RISE_STAGING_DEMO_PASSWORD: Demo@12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rise-ai-frontend/package-lock.json
      - name: Prepare isolated MySQL Flyway trigger permissions
        run: |
          mysql_id=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -1)
          test -n "$mysql_id"
          docker exec "$mysql_id" mysql -uroot -pci-only-root-password -e "SET GLOBAL log_bin_trust_function_creators=1;"
      - name: Build actual Spring Boot Backend
        working-directory: rise-ai-backend
        run: mvn -B -DskipTests package
      - name: Start real Spring Boot and seed ephemeral demo database
        env:
          RISE_MONITORING_ENABLED: 'false'
          RISE_JOBS_ENABLED: 'false'
          RISE_SEED_ENABLED: 'true'
          RISE_JWT_SECRET: ci-only-rise-b2-staging-secret-more-than-32-characters
          RISE_SECURITY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5174
        run: |
          jar_path=$(find rise-ai-backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' ! -name '*-sources.jar' | head -1)
          test -n "$jar_path"
          nohup java -jar "$jar_path" > /tmp/b2-staging-spring.log 2>&1 &
          healthy=0
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then tail -130 /tmp/b2-staging-spring.log; exit 1; fi
          echo "Spring Boot/MySQL demo Backend: UP"
      - name: Validate standalone frontend Compose configuration
        run: docker compose -p rise-b2-staging-qa -f rise-ai-frontend/compose.frontend.yml config -q
      - name: Build actual release Docker/Nginx frontend and start localhost staging
        run: |
          docker compose -p rise-b2-staging-qa -f rise-ai-frontend/compose.frontend.yml up -d --build
          healthy=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5174/healthz | grep -q ok; then healthy=1; break; fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose -p rise-b2-staging-qa -f rise-ai-frontend/compose.frontend.yml logs --tail=150
            exit 1
          fi
          echo "Nginx production frontend staging (loopback only): UP"
      - name: Install browser QA dependencies (temporary only)
        working-directory: rise-ai-frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Read-only FE-06 deployed-container HTTP smoke
        working-directory: rise-ai-frontend
        run: npm run deploy:smoke
      - name: Real browser staging acceptance (no API mocks, desktop 1440px only)
        working-directory: rise-ai-frontend
        run: node scripts/homepage-b2.staging.qa.mjs
      - name: Upload staging Chromium screenshot, API log and JSON verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-b2-staging-production-nginx-1440
          path: rise-ai-frontend/visual-qa/b2-v132/staging/
          if-no-files-found: warn
          retention-days: 14
      - name: Clean up only the isolated frontend staging compose
        if: always()
        run: docker compose -p rise-b2-staging-qa -f rise-ai-frontend/compose.frontend.yml down || true

name: Frontend checks
on:
  pull_request:
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'rise-ai-backend/docs/api/openapi-v1.json'
  push:
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'rise-ai-backend/docs/api/openapi-v1.json'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rise-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: FE-00 lockfile handoff (temporary)
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json', 'utf8')));
          console.log('RISE_LOCK_BEGIN');
          for (let i = 0; i < lock.length; i += 1600) {
            console.log('RISE_LOCK_PART_' + String(i / 1600).padStart(5, '0') + ':' + lock.slice(i, i + 1600));
          }
          console.log('RISE_LOCK_END');
          NODE
      - run: npm run verify

name: Frontend checks
on:
  pull_request:
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'rise-ai-backend/docs/api/openapi-v1.json'
  push:
    paths:
      - 'rise-ai-frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'rise-ai-backend/docs/api/openapi-v1.json'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rise-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rise-ai-frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify

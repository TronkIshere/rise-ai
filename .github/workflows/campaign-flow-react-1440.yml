name: Campaign Flow — React Detail Contribution 1440 QA
on:
  push:
    branches:
      - feat/campaign-flow-detail-contribution-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rise-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rise-ai-frontend/package-lock.json
      - name: Install frontend
        run: npm ci --no-audit --no-fund
      - name: Full frontend verification
        run: npm run verify
      - name: Install Chromium QA tooling
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Campaign → Detail → Contribution flow
        run: node scripts/qa-campaign-flow-1440.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-flow-react-1440
          path: rise-ai-frontend/qa-evidence/campaign-flow/
          if-no-files-found: warn

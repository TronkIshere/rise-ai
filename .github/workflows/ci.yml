name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend tests (Testcontainers MySQL, OpenAPI contract, layering)
        working-directory: rise-ai-backend
        run: mvn -B clean test

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Monitoring tests and package
        working-directory: rise-ai-monitoring
        run: sh ./mvnw -B clean package
      - name: Simulator tests and package
        working-directory: rise-ai-monitoring/test-simulator
        run: mvn -B clean package
      - name: Rise rule suite against the packaged monitor
        run: |
          mkdir -p "$RUNNER_TEMP/suite" && cd "$RUNNER_TEMP/suite"
          MONITORING_SERVICE_KEY=ci-suite-key-0123456789 SERVER_PORT=8083 MONITORING_AI_ENABLED=false SPRING_PROFILES_ACTIVE=riseai             java -jar "$GITHUB_WORKSPACE/rise-ai-monitoring/target/rise-ai-monitoring.jar" > monitor.log 2>&1 &
          for i in $(seq 1 45); do curl -sf localhost:8083/actuator/health > /dev/null && break; sleep 2; done
          java -jar "$GITHUB_WORKSPACE/rise-ai-monitoring/test-simulator/target/rise-ai-monitoring-simulator.jar"             --simulator.suite=rise --simulator.core-url=http://localhost:8083 --simulator.service-key=ci-suite-key-0123456789             --simulator.report-directory="$RUNNER_TEMP/suite/reports"

  avalanche-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rise-ai-avalanche/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.7
      - name: Pinned Solidity dependencies (OpenZeppelin 5.7.0, forge-std dc647cc)
        run: bash scripts/install-deps.sh
      - name: Contract tests (unit, fuzz, invariants, deploy guard)
        run: forge test --summary

  avalanche-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Gateway tests (Testcontainers MySQL and Anvil)
        working-directory: rise-ai-avalanche
        run: mvn -B clean test

  images:
    runs-on: ubuntu-latest
    needs: [backend, monitoring]
    steps:
      - uses: actions/checkout@v4
      - name: Compose images build
        env:
          RISE_DB_PASSWORD: ci
          RISE_DB_ROOT_PASSWORD: ci
          RISE_JWT_SECRET: ci-only-jwt-secret-0123456789-abcdefghijkl
          RISE_MONITORING_SERVICE_KEY: ci-only-service-key
        run: docker compose build

name: Campaign Discovery Section05 HTML Desktop 1440 Review
on:
  push:
    branches:
      - design/campaign-discovery-section05-v13-final-fade-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-html-1440:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rise-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rise-ai-frontend/package-lock.json
      - name: Install Chromium QA tooling
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real HTML Desktop 1440 QA and capture screenshots
        run: node scripts/qa-campaigns-section05-1440.mjs
      - name: Upload before-after full screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-discovery-section05-v131-1440-before-after
          path: docs/design/art-direction/reviews/campaign-discovery-1440-20261112/evidence/
          if-no-files-found: warn
          retention-days: 21
